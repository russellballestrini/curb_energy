[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output and reporting options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=curb_energy
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --junit-xml=tests/results.xml

# Asyncio configuration
asyncio_mode = auto

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (require mocked dependencies)
    functional: Functional/E2E tests (require running server)
    slow: Slow running tests
    requires_auth: Tests requiring authentication credentials

# Coverage configuration
[coverage:run]
source = src/curb_energy
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
