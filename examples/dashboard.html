<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curb Energy Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .config-panel {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .config-panel h3 {
            margin-bottom: 15px;
            color: #667eea;
        }

        .config-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 5px;
            font-weight: 500;
            color: #333;
        }

        input, select, button {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }

        button:hover {
            background: #5568d3;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .stat-card h3 {
            color: #666;
            font-size: 0.9em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-unit {
            font-size: 0.6em;
            color: #999;
        }

        .chart-container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .chart-container h3 {
            margin-bottom: 20px;
            color: #333;
        }

        .error {
            background: #fee;
            border: 1px solid #fcc;
            color: #c33;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .success {
            background: #efe;
            border: 1px solid #cfc;
            color: #3c3;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 1.2em;
        }

        .profiles-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
        }

        .profile-button {
            padding: 15px;
            background: #f8f9fa;
            border: 2px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .profile-button:hover {
            border-color: #667eea;
            background: #f0f0ff;
        }

        .profile-button.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .time-range-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .time-button {
            flex: 1;
            padding: 12px;
            background: white;
            border: 2px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
        }

        .time-button:hover {
            border-color: #667eea;
        }

        .time-button.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚡ Curb Energy Dashboard</h1>
            <p>Real-time energy monitoring and insights</p>
        </div>

        <div class="config-panel">
            <h3>⚙️ Configuration</h3>
            <div id="message"></div>
            <div class="config-form">
                <div class="form-group">
                    <label for="apiUrl">API URL:</label>
                    <input type="text" id="apiUrl" value="http://localhost:8000" placeholder="http://localhost:8000">
                </div>
                <div class="form-group">
                    <label for="profileId">Profile ID:</label>
                    <input type="number" id="profileId" placeholder="Leave empty to fetch from API">
                </div>
            </div>
            <button id="loadProfiles">Load My Profiles</button>
            <div id="profilesList" style="margin-top: 20px;"></div>
        </div>

        <div class="time-range-buttons">
            <button class="time-button active" data-range="today">Today</button>
            <button class="time-button" data-range="week">Past Week</button>
            <button class="time-button" data-range="24h">Last 24 Hours</button>
            <button class="time-button" data-range="custom">Custom Range</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Current Usage</h3>
                <div class="stat-value" id="currentUsage">
                    <span class="loading">---</span>
                    <span class="stat-unit">W</span>
                </div>
            </div>
            <div class="stat-card">
                <h3>Today's Total</h3>
                <div class="stat-value" id="todayTotal">
                    <span class="loading">---</span>
                    <span class="stat-unit">kWh</span>
                </div>
            </div>
            <div class="stat-card">
                <h3>Peak Today</h3>
                <div class="stat-value" id="peakToday">
                    <span class="loading">---</span>
                    <span class="stat-unit">W</span>
                </div>
            </div>
            <div class="stat-card">
                <h3>Average</h3>
                <div class="stat-value" id="avgUsage">
                    <span class="loading">---</span>
                    <span class="stat-unit">W</span>
                </div>
            </div>
        </div>

        <div class="chart-container">
            <h3>Energy Usage Over Time</h3>
            <canvas id="energyChart"></canvas>
        </div>

        <div class="chart-container">
            <h3>Power Distribution</h3>
            <canvas id="distributionChart"></canvas>
        </div>
    </div>

    <script>
        const apiUrl = document.getElementById('apiUrl').value;
        let currentProfileId = null;
        let currentRange = 'today';
        let energyChart = null;
        let distributionChart = null;

        // Initialize charts
        function initCharts() {
            const ctx1 = document.getElementById('energyChart').getContext('2d');
            energyChart = new Chart(ctx1, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Power (W)',
                        data: [],
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            display: true
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'Power (Watts)'
                            }
                        }
                    }
                }
            });

            const ctx2 = document.getElementById('distributionChart').getContext('2d');
            distributionChart = new Chart(ctx2, {
                type: 'bar',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Energy by Hour',
                        data: [],
                        backgroundColor: 'rgba(102, 126, 234, 0.6)',
                        borderColor: '#667eea',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'Energy (Wh)'
                            }
                        }
                    }
                }
            });
        }

        // Show message
        function showMessage(message, type = 'success') {
            const msgDiv = document.getElementById('message');
            msgDiv.className = type;
            msgDiv.textContent = message;
            setTimeout(() => {
                msgDiv.className = '';
                msgDiv.textContent = '';
            }, 5000);
        }

        // Load profiles
        document.getElementById('loadProfiles').addEventListener('click', async () => {
            const apiUrl = document.getElementById('apiUrl').value;
            try {
                const response = await fetch(`${apiUrl}/profiles`);
                if (!response.ok) throw new Error('Failed to fetch profiles');

                const profiles = await response.json();
                const listDiv = document.getElementById('profilesList');

                if (profiles.length === 0) {
                    listDiv.innerHTML = '<p>No profiles found. Make sure authentication is configured.</p>';
                    return;
                }

                listDiv.innerHTML = '<h4 style="margin-bottom: 10px;">Select a Profile:</h4><div class="profiles-list"></div>';
                const profilesGrid = listDiv.querySelector('.profiles-list');

                profiles.forEach(profile => {
                    const btn = document.createElement('button');
                    btn.className = 'profile-button';
                    btn.textContent = profile.name || `Profile ${profile.id}`;
                    btn.onclick = () => {
                        currentProfileId = profile.id;
                        document.getElementById('profileId').value = profile.id;
                        document.querySelectorAll('.profile-button').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        loadData();
                    };
                    profilesGrid.appendChild(btn);
                });

                showMessage('Profiles loaded successfully!', 'success');
            } catch (error) {
                showMessage(`Error loading profiles: ${error.message}`, 'error');
            }
        });

        // Time range buttons
        document.querySelectorAll('.time-button').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.time-button').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentRange = this.dataset.range;
                if (currentProfileId) loadData();
            });
        });

        // Load energy data
        async function loadData() {
            if (!currentProfileId) {
                showMessage('Please select a profile first', 'error');
                return;
            }

            const apiUrl = document.getElementById('apiUrl').value;
            let endpoint, params;

            switch(currentRange) {
                case 'today':
                    endpoint = `/energy/today?profile_id=${currentProfileId}`;
                    break;
                case 'week':
                    endpoint = `/energy/week?profile_id=${currentProfileId}`;
                    break;
                case '24h':
                    endpoint = `/energy/historical`;
                    params = {
                        profile_id: currentProfileId,
                        hours_back: 24,
                        granularity: '1H'
                    };
                    break;
                default:
                    endpoint = `/energy/today?profile_id=${currentProfileId}`;
            }

            try {
                let response;
                if (params) {
                    response = await fetch(`${apiUrl}${endpoint}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(params)
                    });
                } else {
                    response = await fetch(`${apiUrl}${endpoint}`);
                }

                if (!response.ok) throw new Error('Failed to fetch data');

                const data = await response.json();
                updateDashboard(data);
                showMessage('Data loaded successfully!', 'success');
            } catch (error) {
                showMessage(`Error loading data: ${error.message}`, 'error');
            }
        }

        // Update dashboard with data
        function updateDashboard(data) {
            // This is a simplified example - adapt based on your actual data structure
            console.log('Received data:', data);

            // Update stats (you'll need to parse your actual data structure)
            document.getElementById('currentUsage').innerHTML = '1,234<span class="stat-unit">W</span>';
            document.getElementById('todayTotal').innerHTML = '24.5<span class="stat-unit">kWh</span>';
            document.getElementById('peakToday').innerHTML = '2,456<span class="stat-unit">W</span>';
            document.getElementById('avgUsage').innerHTML = '1,020<span class="stat-unit">W</span>';

            // Update charts with mock data (replace with actual data parsing)
            const hours = Array.from({length: 24}, (_, i) => `${i}:00`);
            const values = Array.from({length: 24}, () => Math.random() * 2000 + 500);

            energyChart.data.labels = hours;
            energyChart.data.datasets[0].data = values;
            energyChart.update();

            distributionChart.data.labels = hours;
            distributionChart.data.datasets[0].data = values;
            distributionChart.update();
        }

        // Initialize
        initCharts();

        // Auto-load if profile ID is set
        const profileInput = document.getElementById('profileId');
        if (profileInput.value) {
            currentProfileId = parseInt(profileInput.value);
            loadData();
        }
    </script>
</body>
</html>
